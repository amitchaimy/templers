function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hashStr(s){let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function optionsFor(room,g,s,r){
  const R=rng(hashStr(room)+g*7919+s*613+r*97);
  const q=STAGES[s].qs[r]; const digits=shuffle([1,2,3,4,5,6,7,8,9],R).slice(0,4); const order=shuffle([0,1,2,3],R);
  return order.map((oi,k)=>({text:q.o[oi],digit:digits[k],correct:oi===0}));
}
const correctDigit=(room,g,s,r)=>optionsFor(room,g,s,r).find(o=>o.correct).digit;
const codeFor=(room,g,s)=>[0,1,2,3,4].map(r=>correctDigit(room,g,s,r)).join('');
function membersOf(game,g){
  return Object.entries(game.players||{}).filter(([,p])=>p.group==g).sort((a,b)=>(a[1].joinedAt-b[1].joinedAt)||(a[0]<b[0]?-1:1)).map(([id,p])=>({id,...p}));
}
function rolesOf(game,g,pid){const m=membersOf(game,g);const i=m.findIndex(x=>x.id===pid);if(i<0||!m.length)return[];return[0,1,2,3,4].filter(r=>r%m.length===i)}
function roleOwner(game,g,r){const m=membersOf(game,g);return m.length?m[r%m.length]:null}
function groupIds(game){return Object.keys(game.groups||{}).map(Number).sort((a,b)=>a-b)}
function soloFor(room,g,idx){const R=rng(hashStr(room)+g*31+idx*17+5);const qi=(g*3+idx)%SOLO.length;const q=SOLO[qi];return{q:q.q,opts:shuffle(q.o.map((t,i)=>({text:t,correct:i===0})),R)}}
function chunkFor(nGroups,gi){const n=SENTENCE.length,a=Math.floor(gi*n/nGroups),b=Math.floor((gi+1)*n/nGroups);return{words:SENTENCE.slice(a,b).join(' '),from:a+1}}
function fmtTime(ms){if(ms<0)ms=0;const s=Math.round(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function playerStageAnswered(game,g,s,pid){const p=game.players?.[pid];return rolesOf(game,g,pid).every(r=>p?.picks?.[s+'_'+r]!=null)}
function groupDone(game,g){return game.groups?.[g]?.finishedAt!=null}
function penaltyOf(game,g){
  const gr=game.groups?.[g]||{};
  const codeFails=Object.values(gr.fails||{}).reduce((a,f)=>a+(f.count||0),0);
  const soloWrong=membersOf(game,g).reduce((a,m)=>a+(m.solo?.wrong||0),0);
  return {codeFails,soloWrong,sec:codeFails*CODE_PENALTY+soloWrong*SOLO_PENALTY};
}
function leaderboard(game){
  return groupIds(game).map(g=>{const gr=game.groups[g]||{},done=groupDone(game,g),pen=penaltyOf(game,g);
    const raw=done?Math.max(0,Math.round((gr.finishedAt-(game.startedAt||gr.finishedAt))/1000)):null;
    return {g,done,stage:gr.stage||0,raw,pen,score:done?raw+pen.sec:null}})
   .sort((a,b)=>a.done!==b.done?(a.done?-1:1):a.done?(a.score-b.score):((b.stage-a.stage)||(a.pen.sec-b.pen.sec)));
}
const fmtSec=sec=>fmtTime(sec*1000);
const MEDALS=['🥇','🥈','🥉'];
function vLeaderboard(game,big,mine){

    return `<tr class="${x.done?'':'nf'} ${i===0&&x.done?'win':''} ${x.g===mine?'mine':''}"><td class="rk">${x.done?(MEDALS[i]||i+1):'–'}</td>

async function joinRoom(code,name){
  code=code.trim(); name=name.trim().slice(0,20);
  if(!/^\d{4}$/.test(code))return 'קוד החדר הוא 4 ספרות';
  if(!name)return 'כתבו שם';
  const g=await DB.get('games/'+code+'/status');
  if(!g)return 'לא נמצא חדר עם הקוד הזה';
  if(g==='ended')return 'המשחק בחדר הזה כבר נגמר';
  const pid=genId();
  const p={name,joinedAt:DB.now(),online:true};
  // late join: put into the smallest group
  const full=await DB.get('games/'+code);
  if(full.groups){
    const gs=Object.keys(full.groups).map(Number);
    let best=gs[0],bc=1e9;for(const gg of gs){const c=membersOf(full,gg).length;if(c<bc){bc=c;best=gg}}
    p.group=best;
  }
  await DB.set('games/'+code+'/players/'+pid,p);
  DB.onDisc('games/'+code+'/players/'+pid+'/online',false);
  me={room:code,pid};meSet(me);listen(code);
  return null;
}
function resumePresence(){if(me&&game?.players?.[me.pid]){DB.set('games/'+me.room+'/players/'+me.pid+'/online',true);DB.onDisc('games/'+me.room+'/players/'+me.pid+'/online',false)}}

function playerKey(){
  if(!me)return 'join';
  if(game===undefined)return 'loading';
  if(!game)return 'kicked';
  const p=game.players?.[me.pid]; if(!p)return 'kicked';
  if(game.status==='ended')return 'ended';
  if(p.group==null)return 'lobby';
  const g=p.group, gr=game.groups?.[g]||{}, roles=rolesOf(game,g,me.pid).join('');
  if(game.status!=='playing')return 'grouped|'+g+'|'+roles;
  if(groupDone(game,g))return 'finish|'+g+'|'+JSON.stringify(leaderboard(game).map(x=>[x.g,x.score,x.stage,x.pen.sec]));
  const st=gr.stage||0;
  if(st>=3)return 'solo|'+g+'|'+(p.solo?.done?'done':'q');
  return 'stage|'+g+'|'+st+'|'+roles+'|'+JSON.stringify(p.picks||{});
}

async function createRoom(){

function suggestGroups(n){if(n<=0)return 0;return Math.max(1,Math.ceil(n/MAX_GROUP))}
async function distribute(nGroups){
  const ids=shuffle(Object.keys(game.players||{}),Math.random);
  const n=ids.length;if(!n)return;nGroups=Math.max(1,Math.min(nGroups||suggestGroups(n),n));
  const upd={};const groups={};
  for(let g=1;g<=nGroups;g++)groups[g]={stage:0};
  ids.forEach((id,i)=>{upd['players/'+id+'/group']=(i%nGroups)+1;upd['players/'+id+'/picks']=null;upd['players/'+id+'/solo']=null});
  upd.groups=groups;upd.status='grouped';
  await DB.update('games/'+room,upd);
}
async function addGroup(){const gs=groupIds(game);const n=(gs.at(-1)||0)+1;await DB.set('games/'+room+'/groups/'+n,{stage:0})}
async function autoPlace(){
  const gs=groupIds(game);if(!gs.length)return;const upd={};const cnt={};gs.forEach(g=>cnt[g]=membersOf(game,g).length);
  for(const [id,p] of Object.entries(game.players||{}))if(p.group==null){let best=gs[0];gs.forEach(g=>{if(cnt[g]<cnt[best])best=g});cnt[best]++;upd['players/'+id+'/group']=best}
  await DB.update('games/'+room,upd);
}

function render(force){
  if(IS_ADMIN)return renderAdmin(force);
  if(me&&!game&&!unsub){listen(me.room);return}
  if(me&&game===null&&unsub){/* room deleted or loading */}
  const key=playerKey();
  if(!force&&key===lastKey){patch();return}
  lastKey=key; let html;
  const [kind,g,s]=key.split('|');
  if(kind==='loading')html='<div class="card hero">טוען…</div>';
  else if(kind==='join')html=vJoin();
  else if(kind==='kicked'){me=null;meSet(null);html=vJoin('יצאת מהחדר – אפשר להיכנס שוב')}
  else if(kind==='lobby')html=vLobby();
  else if(kind==='grouped')html=vGrouped(+g);
  else if(kind==='stage')html=vStage(+g,+s);
  else if(kind==='solo')html=vSolo(+g);
  else if(kind==='finish')html=vFinish(+g);
  else if(kind==='ended')html=vEnded();
  const y=window.scrollY, sameScreen=app.dataset.screen===kind+g+s;
  if(!['join','loading','kicked'].includes(kind)){
    const midGame=['grouped','stage','solo'].includes(kind);
    html+=kind==='ended'||kind==='finish'
      ?'<button class="btn" id="leaveGame">🔄 כניסה למשחק חדש</button>'
      :`<button class="btn secondary" id="leaveGame" data-mid="${midGame?1:''}">${kind==='lobby'?'↩️ טעיתי בשם או בקוד – יציאה':'🚪 יציאה מהמשחק'}</button>`;
  }
  html+='<p class="muted" style="text-align:center;font-size:11px;margin-top:18px">גרסה '+APP_VERSION+'</p>';
  app.className=''; app.innerHTML='<div class="'+(sameScreen?'':'fade')+'">'+html+'</div>';
  app.dataset.screen=kind+g+s;
  if(sameScreen)window.scrollTo(0,y);else{window.scrollTo(0,0);codeDraft=['','','','',''];localMsg=''}
  bindPlayer(); patch();
}
function patch(){
  if(!game||!me)return;
  const p=game.players?.[me.pid];if(!p)return;const g=p.group;
  const t=document.getElementById('team');if(t&&g!=null){const s=game.groups?.[g]?.stage||0;t.innerHTML=teamChips(g,s)}
  const lm=document.getElementById('lockmsg');if(lm&&g!=null){const s=game.groups?.[g]?.stage||0;lm.innerHTML=failMsg(g,s)}
  tick();
}
function tick(){
  if(!game)return;
  const el=document.getElementById('timer');
  if(el&&game.status==='playing'&&game.startedAt){
    const left=game.startedAt+game.durationMin*60000-DB.now();
    el.textContent=left>0?fmtTime(left):'00:00';el.classList.toggle('late',left<=60000);
    const tu=document.getElementById('timeup');if(tu)tu.innerHTML=left<=0?'<div class="banner">⏰ הזמן נגמר! תסיימו מהר…</div>':'';
  }
  const cd=document.getElementById('cd');
  if(cd){const l=Math.ceil((lockUntil-Date.now())/1000);if(l<=0){lastKey='';render()}else cd.textContent=l}
}
let adminDefer=false;
function renderAdmin(force){
  app.className='wide';
  if(!adminPinOk){if(app.dataset.screen!=='pin'){app.innerHTML=vAdminPin();app.dataset.screen='pin';bindAdmin()}return}
  const saved=lsGet('templers_admin_room');
  if(!room&&saved){listen(saved);return}
  if(!room||!game){if(app.dataset.screen!=='astart'){app.innerHTML=vAdminStart();app.dataset.screen='astart';bindAdmin()}return}
  const a=document.activeElement;
  if(!force&&a&&a.tagName==='SELECT'&&app.contains(a)){adminDefer=true;return}
  adminDefer=false;
  const y=window.scrollY;
  app.innerHTML=vAdmin();
  app.dataset.screen='admin';
  window.scrollTo(0,y);
  const qrEl=document.getElementById('qr');
  if(qrEl&&window.QRCode){new QRCode(qrEl,{text:joinUrl(),width:200,height:200})}
  bindAdmin(); tick();
}

/* ===================================================================
   EVENTS
   =================================================================== */
function bindPlayer(){
  const lv=document.getElementById('leaveGame');
  if(lv)lv.onclick=()=>{
    if(lv.dataset.mid&&!lv.dataset.sure){lv.dataset.sure=1;lv.textContent='בטוח? הקבוצה צריכה אותך! לחצו שוב ליציאה';return}
    const p=me&&game?.players?.[me.pid];
    if(p&&game.status!=='ended'&&!(p.group!=null&&groupDone(game,p.group)))DB.remove('games/'+me.room+'/players/'+me.pid);
    if(unsub)unsub();unsub=null;me=null;meSet(null);game=undefined;room=null;lastKey='';
    history.replaceState(null,'',location.pathname);render(true);
  };
  const jb=document.getElementById('joinBtn');
  if(jb)jb.onclick=async()=>{jb.disabled=true;const err=await joinRoom(document.getElementById('jcode').value,document.getElementById('jname').value);
    if(err){document.getElementById('jerr').innerHTML=`<div class="msg err">${esc(err)}</div>`;jb.disabled=false}};
  app.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{
    DB.set('games/'+room+'/players/'+me.pid+'/picks/'+b.dataset.pick,+b.dataset.v);
  });
  const slots=[...app.querySelectorAll('[data-slot]')];
  slots.forEach((inp,i)=>{
    inp.oninput=()=>{inp.value=inp.value.replace(/\D/g,'').slice(-1);codeDraft[i]=inp.value;inp.classList.remove('bad');if(inp.value&&slots[i+1])slots[i+1].focus()};
    inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&slots[i-1])slots[i-1].focus()};
  });
  const tc=document.getElementById('tryCode');
  if(tc)tc.onclick=async()=>{
    const g=game.players[me.pid].group, s=game.groups[g].stage||0, val=codeDraft.join(''), lm=document.getElementById('lockmsg');
    if(val.length<5){lm.innerHTML='<div class="msg err">חסרות ספרות – צריך 5, אחת מכל תפקיד.</div>';return}
    const code=codeFor(room,g,s);
    if(val===code){
      await DB.tx('games/'+room+'/groups/'+g+'/stage',cur=>((cur||0)===s?s+1:undefined));
      await DB.set('games/'+room+'/groups/'+g+'/stageAt/'+(s+1),DB.ts());
      return;
    }
    const wrong=[];for(let i=0;i<5;i++)if(val[i]!==code[i]){wrong.push(i);slots[i].classList.add('bad')}
    const name=game.players[me.pid].name;
    await DB.tx('games/'+room+'/groups/'+g+'/fails/'+s,f=>({count:((f&&f.count)||0)+1,by:name,wrong:wrong.join(',')}));
  };
  app.querySelectorAll('[data-solo]').forEach(b=>b.onclick=async()=>{
    if(Date.now()<lockUntil)return;
    const g=game.players[me.pid].group, idx=membersOf(game,g).findIndex(m=>m.id===me.pid), o=soloFor(room,g,idx).opts[+b.dataset.solo];
    const base='games/'+room+'/players/'+me.pid+'/solo';
    if(o.correct){
      await DB.update(base,{done:true,at:DB.ts()});
      // if everyone done -> mark group finished
      const fresh=await DB.get('games/'+room);
      if(membersOf(fresh,g).every(m=>m.solo?.done))await DB.tx('games/'+room+'/groups/'+g+'/finishedAt',v=>v==null?DB.now():undefined);
    }else{
      lockUntil=Date.now()+LOCKOUT_SEC*1000;
      await DB.tx(base+'/wrong',w=>(w||0)+1);
      lastKey='';render();
    }
  });
}
// when a group member is removed/moved and everyone remaining is done, finish the group
function checkGroupFinish(){
  if(!game||game.status!=='playing'||!me)return;const g=game.players?.[me.pid]?.group;if(g==null)return;
  const gr=game.groups?.[g];if(!gr||gr.finishedAt||(gr.stage||0)<3)return;
  const m=membersOf(game,g);if(m.length&&m.every(x=>x.solo?.done))DB.tx('games/'+room+'/groups/'+g+'/finishedAt',v=>v==null?DB.now():undefined);
}
setInterval(checkGroupFinish,2000);

function bindAdmin(){
  const $=id=>document.getElementById(id);
  if($('pinGo'))$('pinGo').onclick=()=>{if($('pin').value.trim()===window.ADMIN_PIN){adminPinOk=true;lsSet('templers_admin_ok',true);app.dataset.screen='';render(true)}else $('pinmsg').innerHTML='<div class="msg err">קוד שגוי</div>'};
  if($('newRoom'))$('newRoom').onclick=createRoom;
  if($('newRoom2'))$('newRoom2').onclick=()=>{if($('newRoom2').dataset.sure){lsSet('templers_admin_room',null);room=null;game=null;if(unsub)unsub();unsub=null;adminView='panel';app.dataset.screen='';render(true)}else{$('newRoom2').dataset.sure=1;$('newRoom2').textContent='בטוח? לחצו שוב'}};
  if($('distribute'))$('distribute').onclick=()=>distribute(+$('ngroups').value);
  if($('addGroup'))$('addGroup').onclick=addGroup;
  if($('autoPlace'))$('autoPlace').onclick=autoPlace;
  if($('dur'))$('dur').onchange=()=>DB.set('games/'+room+'/durationMin',+$('dur').value);
  if($('ngroups'))$('ngroups').onchange=()=>{if(adminDefer)render(true)};
  if($('start'))$('start').onclick=async()=>{await autoPlace();await DB.update('games/'+room,{status:'playing',startedAt:DB.ts()})};
  if($('end'))$('end').onclick=()=>{if($('end').dataset.sure)DB.update('games/'+room,{status:'ended',endedAt:DB.ts()});else{$('end').dataset.sure=1;$('end').textContent='בטוח? לחצו שוב'}};
  if($('plus2'))$('plus2').onclick=()=>DB.set('games/'+room+'/durationMin',(game.durationMin||12)+2);
  if($('copyLink'))$('copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(joinUrl());$('copyLink').textContent='✓ הועתק'}catch(e){$('copyLink').textContent=joinUrl()}};
  if($('back'))$('back').onclick=()=>{adminView='panel';render(true)};
  app.querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>{if(b.dataset.sure)DB.remove('games/'+room+'/players/'+b.dataset.kick);else{b.dataset.sure=1;b.textContent='הסר?'}});
  app.querySelectorAll('[data-move]').forEach(s=>s.onchange=async()=>{if(s.value)await DB.update('games/'+room+'/players/'+s.dataset.move,{group:+s.value});s.blur();render(true)});
  app.querySelectorAll('select').forEach(s=>s.onblur=()=>{if(adminDefer)setTimeout(()=>render(true),50)});
  app.querySelectorAll('details[data-dkey]').forEach(d=>d.addEventListener('toggle',()=>{d.open?openDetails.add(d.dataset.dkey):openDetails.delete(d.dataset.dkey)}));
  app.querySelectorAll('[data-skip]').forEach(b=>b.onclick=async()=>{
    const g=+b.dataset.skip, s=game.groups[g].stage||0;
    if(s<3)await DB.set('games/'+room+'/groups/'+g+'/stage',s+1);
    else await DB.set('games/'+room+'/groups/'+g+'/finishedAt',DB.now());
  });
  app.querySelectorAll('[data-delgroup]').forEach(b=>b.onclick=()=>DB.remove('games/'+room+'/groups/'+b.dataset.delgroup));
}

/* ===================================================================
   BOOT
   =================================================================== */
if(!IS_ADMIN&&me&&params.get('room')&&params.get('room')!==me.room){me=null;meSet(null)}
if(!IS_ADMIN&&me){
  const st=await DB.get('games/'+me.room+'/players/'+me.pid);
  if(st){listen(me.room);setTimeout(resumePresence,300)}else{me=null;meSet(null)}
}
if(!IS_ADMIN&&!me&&params.get('room')){/* prefilled */}
DB.connected(c=>{if(c&&!IS_ADMIN)resumePresence()});
render(true);
</script>
